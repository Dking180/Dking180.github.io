
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">
<title>D'KING | Writer & Director</title>

<style>
:root {
  --bg:#090909;
  --gold:#d6b46a;
  --white:#f5f1e9;
  --muted:#a5a19a;
  --panel:#151515;
  --border:rgba(214,180,106,.38);
}

*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--white);font-family:Georgia,serif;line-height:1.7}
a{text-decoration:none;color:inherit}
header{position:sticky;top:0;z-index:100;background:#090909;border-bottom:1px solid var(--border);padding:17px 6%;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;color:var(--gold);font-weight:bold;letter-spacing:4px}
nav{display:flex;gap:20px}
nav a{font:11px Arial;letter-spacing:1px;color:var(--muted)}
nav a:hover{color:var(--gold)}
.menu-btn{display:none;background:none;border:1px solid var(--gold);color:var(--gold);padding:7px 12px}
section{padding:75px 7%;border-bottom:1px solid var(--border)}
.container{max-width:1150px;margin:auto}
.hero{min-height:85vh;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at center,#302719,#090909 70%)}
.hero h1{font-size:clamp(48px,9vw,88px);color:var(--gold);letter-spacing:8px}
.hero h2{font-size:16px;letter-spacing:5px;font-weight:normal;margin:12px}
.hero p,.section-subtitle{color:var(--muted);font:13px Arial;letter-spacing:1px}
.gold-line{width:75px;height:2px;background:var(--gold);margin:22px auto}
.buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:25px}
.btn{display:inline-block;border:1px solid var(--gold);color:var(--gold);padding:12px 21px;font:11px Arial;letter-spacing:1.2px;text-align:center;transition:.3s}
.btn:hover{background:var(--gold);color:#090909}
.btn.filled{background:var(--gold);color:#090909}
.section-title{text-align:center;color:var(--gold);font-size:32px;letter-spacing:2px;margin-bottom:12px}
.section-subtitle{text-align:center;margin-bottom:40px}
.page-heading{text-align:center;padding:70px 15px 40px;background:linear-gradient(#17130d,#090909);border-bottom:1px solid var(--border)}
.page-heading h1{color:var(--gold);font-size:clamp(30px,6vw,52px);letter-spacing:3px}
.page-heading p{color:var(--muted);font:13px Arial;margin-top:10px}
.back-link{display:inline-block;color:var(--gold);font:12px Arial;margin-bottom:25px}
.about-grid,.detail-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:40px;align-items:center}
.about-image img{width:100%;max-height:480px;object-fit:cover;border:1px solid var(--gold)}
.about-text h3,.detail-copy h2{color:var(--gold);font-size:29px;margin-bottom:15px}
.about-text p,.detail-copy p{color:var(--muted);font:14px/1.8 Arial;margin-bottom:15px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:25px}
.card{background:var(--panel);border:1px solid var(--border);overflow:hidden;transition:.3s}
.card:hover{border-color:var(--gold);transform:translateY(-4px)}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}
.card-content{padding:20px}
.card h3{color:var(--gold);font-size:23px;margin-bottom:8px}
.card p{color:var(--muted);font:13px/1.6 Arial;margin-bottom:15px}
.detail-poster{width:100%;max-width:390px;display:block;margin:auto;border:1px solid var(--gold)}
.detail-copy .buttons{justify-content:flex-start}
.media-frame{width:100%;aspect-ratio:16/9;background:#111;border:1px solid var(--border);margin:20px 0 40px}
.media-frame iframe,.media-frame video{width:100%;height:100%;border:0}
.media-placeholder{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px;color:var(--muted);font:14px Arial}
.media-placeholder strong{color:var(--gold);font-size:20px}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.gallery img{width:100%;aspect-ratio:3/4;object-fit:cover;border:1px solid var(--border)}
.thought{background:var(--panel);border-left:2px solid var(--gold);padding:24px;margin-bottom:20px}
.thought h3{color:var(--gold);margin-bottom:10px}
.thought p{color:var(--muted);font:14px/1.7 Arial}
.contact-box{max-width:700px;margin:auto;padding:35px;text-align:center;background:var(--panel);border:1px solid var(--gold)}
.contact-box p{color:var(--muted);font:14px Arial;margin:14px 0;overflow-wrap:anywhere}
footer{text-align:center;padding:28px;color:var(--muted);font:11px Arial;letter-spacing:1px;border-top:1px solid var(--border)}
footer span{color:var(--gold)}
.loader{position:fixed;inset:0;z-index:9999;background:#090909;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:.6s}
.loader.hide{opacity:0;visibility:hidden}
.loader-logo{font-size:90px;color:var(--gold);font-weight:bold}
.loader-name{letter-spacing:7px}
.loader-line{width:130px;height:2px;background:var(--gold);margin-top:22px;animation:loading 1.3s infinite}
@keyframes loading{0%{transform:scaleX(.1)}50%{transform:scaleX(1)}100%{transform:scaleX(.1)}}

@media(max-width:760px){
 header{padding:15px 5%}
 .menu-btn{display:block}
 nav{display:none;position:absolute;top:65px;left:0;right:0;background:#090909;padding:20px;flex-direction:column;border-bottom:1px solid var(--gold)}
 nav.open{display:flex}
 .about-grid,.detail-grid{grid-template-columns:1fr}
 .cards{grid-template-columns:1fr}
 .gallery{grid-template-columns:repeat(2,1fr)}
 section{padding:60px 6%}
 .contact-box{padding:25px 15px}
}
</style>
</head>

<body>

<div class="loader" id="loader">

function button(label,page,filled=false){
 return `<a class="btn ${filled?"filled":""}" href="?page=${page}">${label}</a>`;
}

function heading(title,subtitle){
 return `<div class="page-heading"><h1>${title}</h1><p>${subtitle}</p></div>`;
}

function videoBox(url,title){
 if(url){
  return `<div class="media-frame"><iframe src="${url}" title="${title}" allowfullscreen loading="lazy"></iframe></div>`;
 }
 return `<div class="media-frame"><div class="media-placeholder"><strong>${title}</strong><p>Video space ready. Add your video URL in the videos section of the code.</p></div></div>`;
}

function filmCards(){
 return `<div class="cards">

 <section><div class="container">
 <a class="back-link" href="?page=films">← BACK TO FILMS</a>

 const body=encodeURIComponent("Hello Darshan,\n\nI am interested in your book A Man With Two Brains. Please share more details.\n\nThank you.");

 return `${heading("A MAN WITH TWO BRAINS","ONE MAN • TWO MINDS • COUNTLESS QUESTIONS")}

function renderPage(){
 const current=new URLSearchParams(location.search).get("page")||"home";
 document.getElementById("app").innerHTML=(pages[current]||homePage)();
 document.title=(current==="home"?"D'KING":current.replaceAll("-"," ").toUpperCase()+" | D'KING");
 document.getElementById("navigation").classList.remove("open");
 window.scrollTo(0,0);
}

function toggleMenu(){
 document.getElementById("navigation").classList.toggle("open");
}

document.getElementById("year").textContent=new Date().getFullYear();
renderPage();

window.addEventListener("load",()=>{
 setTimeout(()=>document.getElementById("loader").classList.add("hide"),800);
});
